<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2196f3">
<title>كلمات | المراسلة</title>
<style>
  :root { --blue:#2196f3; --sky:#4fc3f7; --grad:linear-gradient(135deg,#4fc3f7,#1e88e5); --bg:#f0f8ff; --text:#0d2b45; --muted:#6b8299; --mine:#d6efff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  .screen { display:none; height:100%; flex-direction:column; }
  .screen.active { display:flex; }
  header { background:var(--grad); color:#fff; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 14px rgba(33,150,243,.4); }
  header h1 { font-size:18px; flex:1; }
  .icon-btn { background:none; border:0; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px; }
  .btn { background:var(--grad); color:#fff; border:0; border-radius:12px; padding:12px 16px; font-size:15px; cursor:pointer; }
  input { width:100%; padding:12px 14px; border:1px solid #cfe6f7; border-radius:12px; font-size:15px; background:#fff; outline:none; color:var(--text); user-select:text; }
  input:focus { border-color:var(--sky); box-shadow:0 0 0 3px rgba(79,195,247,.25); }

  #auth { align-items:center; justify-content:center; }
  .auth-card { width:min(92%,380px); background:#fff; border-radius:22px; padding:28px 22px; box-shadow:0 8px 30px rgba(33,150,243,.18); display:flex; flex-direction:column; gap:12px; text-align:center; }
  .auth-card h2 { font-size:22px; color:var(--blue); }
  .auth-card .btn { width:100%; }
  .link { color:var(--blue); cursor:pointer; font-size:13px; }
  .err { color:#e53935; font-size:13px; min-height:16px; }

  .search { padding:10px 12px; background:#fff; border-bottom:1px solid #e1eef8; }
  #list { flex:1; overflow-y:auto; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-bottom:1px solid #eef5fb; cursor:pointer; }
  .row:active { background:#e8f6ff; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; position:relative; flex-shrink:0; }
  .avatar.small { width:38px; height:38px; font-size:15px; }
  .dot { position:absolute; bottom:0; left:0; width:12px; height:12px; border-radius:50%; background:#43a047; border:2px solid #fff; display:none; }
  .dot.on { display:block; }
  .meta { flex:1; min-width:0; }
  .name { font-weight:bold; font-size:15px; }
  .sub-line { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { background:var(--blue); color:#fff; border-radius:12px; padding:1px 8px; font-size:12px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; }

  #msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:6px; background:linear-gradient(#eaf6ff,#f7fbff); }
  .bubble { max-width:78%; padding:9px 13px; border-radius:18px; line-height:1.6; word-wrap:break-word; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.06); background:#fff; user-select:text; }
  .bubble.mine { align-self:flex-end; background:var(--mine); border-bottom-left-radius:4px; }
  .bubble.theirs { align-self:flex-start; border-bottom-right-radius:4px; }
  .time { font-size:11px; color:var(--muted); margin-top:3px; text-align:left; direction:ltr; }
  .tick { color:#9aa9b8; margin-right:4px; }
  .tick.read { color:var(--blue); }
  .typing { font-size:12px; color:var(--blue); padding:4px 14px; background:#f7fbff; }
  .chat-head .name { color:#fff; }
  .chat-head .sub-line { color:rgba(255,255,255,.9); }
  .composer { display:flex; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px)); background:#fff; border-top:1px solid #e1eef8; }
  .composer input { border-radius:22px; }
  .send { width:48px; height:48px; border-radius:50%; border:0; background:var(--grad); color:#fff; font-size:18px; cursor:pointer; flex-shrink:0; box-shadow:0 4px 12px rgba(33,150,243,.4); }
</style>
</head>
<body>

<section id="auth" class="screen active">
  <div class="auth-card">
    <h2>كلمات</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
    <div id="regFields" hidden style="display:flex;flex-direction:column;gap:12px">
      <input id="username" placeholder="اسم المستخدم (إنجليزي وأرقام و_)" autocomplete="username">
      <input id="displayName" placeholder="الاسم الظاهر">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="authBtn">دخول</button>
    <span class="link" id="switch">ليس لديك حساب؟ أنشئ حساباً</span>
  </div>
</section>

<section id="home" class="screen">
  <header>
    <h1>المحادثات</h1>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙</button>
    <button class="icon-btn" id="logoutBtn" title="خروج">⎋</button>
  </header>
  <div class="search"><input id="search" placeholder="ابحث عن شخص..."></div>
  <div id="list"></div>
</section>

<section id="chat" class="screen">
  <header class="chat-head">
    <button class="icon-btn" id="back">›</button>
    <div class="avatar small" id="cAvatar"></div>
    <div class="meta">
      <div class="name" id="cName"></div>
      <div class="sub-line" id="cStatus"></div>
    </div>
  </header>
  <div id="msgs"></div>
  <div class="typing" id="typing" hidden>يكتب الآن...</div>
  <div class="composer">
    <input id="txt" placeholder="اكتب رسالة..." autocomplete="off">
    <button class="send" id="sendBtn">➤</button>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, collection,
  query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== ضع إعدادات مشروعك هنا من Project settings > Your apps =====
const firebaseConfig = {
  apiKey: "AIzaSyBQhpp3SSSVBWWrLu6_uvwQ7IojUFxz-pQ",
  authDomain: "hassan2026-go.firebaseapp.com",
  projectId: "hassan2026-go",
  storageBucket: "hassan2026-go.firebasestorage.app",
  messagingSenderId: "608337144076",
  appId: "1:608337144076:web:b1e351887e09abfea68129"
};
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// ================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ms = (ts) => (ts && ts.toMillis ? ts.toMillis() : Date.now());
const timeOf = (ts) => new Date(ms(ts)).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });

let me = null;
let users = new Map();
let unreadBy = {};
let peer = null;
let threadMap = new Map();
let unsubs = [];
let mode = 'login';
let registering = false;
let lastTyping = 0, heartbeat = null;

const isOnline = (u) => u && u.lastSeen && Date.now() - ms(u.lastSeen) < 70000;

function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
}

// ===== الدخول والتسجيل =====
$('#switch').onclick = () => {
  mode = mode === 'login' ? 'register' : 'login';
  $('#regFields').hidden = mode === 'login';
  $('#authBtn').textContent = mode === 'login' ? 'دخول' : 'إنشاء حساب';
  $('#switch').textContent = mode === 'login' ? 'ليس لديك حساب؟ أنشئ حساباً' : 'لديك حساب؟ سجّل الدخول';
  $('#err').textContent = '';
};

const AUTH_ERRORS = {
  'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
  'auth/email-already-in-use': 'هذا البريد مسجل بالفعل',
  'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل)',
  'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة',
  'auth/unauthorized-domain': 'النطاق غير مضاف في Firebase > Authentication > Authorized domains',
  'permission-denied': 'تم رفض الصلاحية، تأكد من نشر قواعد Firestore',
};

$('#authBtn').onclick = async () => {
  $('#err').textContent = '';
  const email = $('#email').value.trim();
  const password = $('#password').value;
  try {
    if (mode === 'login') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const username = $('#username').value.trim().toLowerCase();
      const displayName = $('#displayName').value.trim();
      if (!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error('اسم المستخدم: إنجليزي وأرقام و_ (3-20 حرفاً)');
      if (!displayName) throw new Error('أدخل الاسم الظاهر');

      registering = true;
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      // بعد تسجيل الدخول نتحقق من توفر اسم المستخدم
      const taken = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
      if (!taken.empty) {
        await cred.user.delete();
        registering = false;
        throw new Error('اسم المستخدم مستخدم بالفعل، اختر اسماً آخر');
      }

      await setDoc(doc(db, 'users', cred.user.uid), {
        username, displayName, lastSeen: 0, typingTo: '', typingAt: 0, createdAt: serverTimestamp()
      });
      registering = false;
      await enter(cred.user.uid);
    }
  } catch (e) {
    registering = false;
    $('#err').textContent = AUTH_ERRORS[e.code] || e.message;
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user || registering) return show('auth');
  await enter(user.uid);
});

async function enter(uid) {
  const snap = await getDoc(doc(db, 'users', uid));
  if (!snap.exists()) {
    $('#err').textContent = 'لا يوجد ملف شخصي لهذا الحساب';
    return signOut(auth);
  }
  me = { uid, ...snap.data() };
  show('home');
  startListeners();
  beat();
  clearInterval(heartbeat);
  heartbeat = setInterval(beat, 30000);
}

function beat() {
  if (!me) return;
  updateDoc(doc(db, 'users', me.uid), { lastSeen: serverTimestamp() }).catch(() => {});
}

window.addEventListener('pagehide', () => {
  if (me) updateDoc(doc(db, 'users', me.uid), { lastSeen: 0 }).catch(() => {});
});

// ===== المستمعات العامة =====
function startListeners() {
  onSnapshot(collection(db, 'users'), (snap) => {
    users = new Map();
    snap.forEach((d) => {
      if (d.id === me.uid) me.displayName = d.data().displayName;
      else users.set(d.id, { uid: d.id, ...d.data() });
    });
    renderList();
    updateHead();
  });

  onSnapshot(query(collection(db, 'messages'), where('to', '==', me.uid), where('readAt', '==', null)), (snap) => {
    unreadBy = {};
    snap.forEach((d) => {
      const f = d.data().from;
      unreadBy[f] = (unreadBy[f] || 0) + 1;
    });
    renderList();
  });
}

// ===== قائمة المحادثات =====
$('#search').oninput = renderList;

function renderList() {
  if (!me) return;
  const q = $('#search').value.trim().toLowerCase();
  const list = [...users.values()]
    .filter((u) => !q || (u.displayName || '').toLowerCase().includes(q) || (u.username || '').includes(q))
    .sort((a, b) => (a.displayName || '').localeCompare(b.displayName || '', 'ar'));

  if (!list.length) {
    $('#list').innerHTML = '<div class="empty">لا يوجد أشخاص بعد.<br>شارك الرابط مع أصدقائك للتسجيل.</div>';
    return;
  }
  $('#list').innerHTML = list.map((u) => {
    const badge = unreadBy[u.uid] ? `<span class="badge">${unreadBy[u.uid]}</span>` : '';
    return `
      <div class="row" data-id="${u.uid}">
        <div class="avatar">${esc((u.displayName || '؟')[0])}<span class="dot ${isOnline(u) ? 'on' : ''}"></span></div>
        <div class="meta">
          <div class="name">${esc(u.displayName)}</div>
          <div class="sub-line">@${esc(u.username)}</div>
        </div>
        ${badge}
      </div>`;
  }).join('');
  document.querySelectorAll('#list .row').forEach((row) => {
    row.onclick = () => openChat(users.get(row.dataset.id));
  });
}

// ===== المحادثة =====
function openChat(u) {
  if (!u) return;
  peer = u;
  $('#cName').textContent = u.displayName;
  $('#cAvatar').textContent = (u.displayName || '؟')[0];
  show('chat');
  subscribeThread();
  updateHead();
}

function subscribeThread() {
  unsubs.forEach((f) => f());
  unsubs = [];
  threadMap = new Map();

  const sent = query(collection(db, 'messages'), where('from', '==', me.uid), where('to', '==', peer.uid));
  const received = query(collection(db, 'messages'), where('from', '==', peer.uid), where('to', '==', me.uid));

  for (const q of [sent, received]) {
    unsubs.push(onSnapshot(q, (snap) => {
      snap.docChanges().forEach((ch) => {
        if (ch.type === 'removed') threadMap.delete(ch.doc.id);
        else threadMap.set(ch.doc.id, { id: ch.doc.id, ...ch.doc.data() });
      });
      renderThread();
      markIncomingRead();
    }));
  }
}

function markIncomingRead() {
  threadMap.forEach((m) => {
    if (m.to === me.uid && !m.readAt) {
      updateDoc(doc(db, 'messages', m.id), { readAt: serverTimestamp() }).catch(() => {});
    }
  });
}

function renderThread() {
  const box = $('#msgs');
  const items = [...threadMap.values()].sort((a, b) => ms(a.createdAt) - ms(b.createdAt));
  box.innerHTML = items.map((m) => {
    const mine = m.from === me.uid;
    const tick = mine ? (m.readAt ? '<span class="tick read">✓✓</span>' : '<span class="tick">✓</span>') : '';
    return `<div class="bubble ${mine ? 'mine' : 'theirs'}">${esc(m.text)}<div class="time">${timeOf(m.createdAt)} ${tick}</div></div>`;
  }).join('') || '<div class="empty">ابدأ المحادثة 👋</div>';
  box.scrollTop = box.scrollHeight;
}

function updateHead() {
  if (!peer || !$('#chat').classList.contains('active')) return;
  const p = users.get(peer.uid) || peer;
  const typingNow = p.typingTo === me.uid && Date.now() - ms(p.typingAt) < 3000;
  $('#typing').hidden = !typingNow;
  $('#cStatus').textContent = isOnline(p) ? 'متصل الآن' : 'غير متصل';
  if (typingNow) setTimeout(updateHead, 3100);
}

$('#back').onclick = () => {
  unsubs.forEach((f) => f());
  unsubs = [];
  peer = null;
  show('home');
  renderList();
};

// ===== الإرسال =====
async function send() {
  const body = $('#txt').value.trim();
  if (!body || !peer) return;
  $('#txt').value = '';
  try {
    await addDoc(collection(db, 'messages'), {
      from: me.uid, to: peer.uid, text: body.slice(0, 2000), readAt: null, createdAt: serverTimestamp()
    });
    updateDoc(doc(db, 'users', me.uid), { typingTo: '', typingAt: 0 }).catch(() => {});
  } catch (e) {
    alert('تعذّر الإرسال: ' + e.message);
  }
}

$('#sendBtn').onclick = send;
$('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('#txt').addEventListener('input', () => {
  if (!peer) return;
  const now = Date.now();
  if (now - lastTyping > 1500) {
    lastTyping = now;
    updateDoc(doc(db, 'users', me.uid), { typingTo: peer.uid, typingAt: now }).catch(() => {});
  }
});

// ===== الإعدادات والخروج =====
$('#settingsBtn').onclick = async () => {
  const name = prompt('الاسم الظاهر الجديد:', me.displayName);
  if (!name || !name.trim()) return;
  await updateDoc(doc(db, 'users', me.uid), { displayName: name.trim() });
  me.displayName = name.trim();
  renderList();
};

$('#logoutBtn').onclick = async () => {
  clearInterval(heartbeat);
  await updateDoc(doc(db, 'users', me.uid), { lastSeen: 0 }).catch(() => {});
  await signOut(auth);
  location.reload();
};

setInterval(() => { renderList(); updateHead(); }, 60000);
</script>
</body>
</html>
