<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2196f3">
<title>كلمات | المراسلة</title>
<style>
  :root { --blue:#2196f3; --sky:#4fc3f7; --grad:linear-gradient(135deg,#4fc3f7,#1e88e5); --bg:#f0f8ff; --text:#0d2b45; --muted:#6b8299; --mine:#d6efff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  .screen { display:none; height:100%; flex-direction:column; }
  .screen.active { display:flex; }
  header { background:var(--grad); color:#fff; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 14px rgba(33,150,243,.4); }
  header h1 { font-size:18px; flex:1; }
  .icon-btn { background:none; border:0; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px; }
  .btn { background:var(--grad); color:#fff; border:0; border-radius:12px; padding:12px 16px; font-size:15px; cursor:pointer; }
  input { width:100%; padding:12px 14px; border:1px solid #cfe6f7; border-radius:12px; font-size:15px; background:#fff; outline:none; color:var(--text); user-select:text; }
  input:focus { border-color:var(--sky); box-shadow:0 0 0 3px rgba(79,195,247,.25); }

  #auth { align-items:center; justify-content:center; }
  .auth-card { width:min(92%,380px); background:#fff; border-radius:22px; padding:28px 22px; box-shadow:0 8px 30px rgba(33,150,243,.18); display:flex; flex-direction:column; gap:12px; text-align:center; }
  .auth-card h2 { font-size:22px; color:var(--blue); }
  .auth-card .btn { width:100%; }
  .link { color:var(--blue); cursor:pointer; font-size:13px; }
  .err { color:#e53935; font-size:13px; min-height:16px; }
  .fields { display:flex; flex-direction:column; gap:12px; }

  .search { padding:10px 12px; background:#fff; border-bottom:1px solid #e1eef8; }
  #list { flex:1; overflow-y:auto; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-bottom:1px solid #eef5fb; cursor:pointer; }
  .row:active { background:#e8f6ff; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; position:relative; flex-shrink:0; }
  .avatar.small { width:38px; height:38px; font-size:15px; }
  .dot { position:absolute; bottom:0; left:0; width:12px; height:12px; border-radius:50%; background:#43a047; border:2px solid #fff; display:none; }
  .dot.on { display:block; }
  .meta { flex:1; min-width:0; }
  .name { font-weight:bold; font-size:15px; }
  .sub-line { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { background:var(--blue); color:#fff; border-radius:12px; padding:1px 8px; font-size:12px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; }

  #msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:6px; background:linear-gradient(#eaf6ff,#f7fbff); }
  .bubble { max-width:78%; padding:9px 13px; border-radius:18px; line-height:1.6; word-wrap:break-word; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.06); background:#fff; user-select:text; }
  .bubble.mine { align-self:flex-end; background:var(--mine); border-bottom-left-radius:4px; }
  .bubble.theirs { align-self:flex-start; border-bottom-right-radius:4px; }
  .time { font-size:11px; color:var(--muted); margin-top:3px; text-align:left; direction:ltr; }
  .tick { color:#9aa9b8; margin-right:4px; }
  .tick.read { color:var(--blue); }
  .typing { font-size:12px; color:var(--blue); padding:4px 14px; background:#f7fbff; }
  .chat-head .name { color:#fff; }
  .chat-head .sub-line { color:rgba(255,255,255,.9); }
  .composer { display:flex; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px)); background:#fff; border-top:1px solid #e1eef8; }
  .composer input { border-radius:22px; }
  .send { width:48px; height:48px; border-radius:50%; border:0; background:var(--grad); color:#fff; font-size:18px; cursor:pointer; flex-shrink:0; box-shadow:0 4px 12px rgba(33,150,243,.4); }
</style>
</head>
<body>

<section id="auth" class="screen active">
  <div class="auth-card">
    <h2>كلمات</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
    <div id="regFields" class="fields" hidden>
      <input id="username" placeholder="اسم المستخدم (إنجليزي وأرقام و_)" autocomplete="username">
      <input id="displayName" placeholder="الاسم الظاهر">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="authBtn">دخول</button>
    <span class="link" id="switch">ليس لديك حساب؟ أنشئ حساباً</span>
  </div>
</section>

<section id="home" class="screen">
  <header>
    <h1>المحادثات</h1>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙</button>
    <button class="icon-btn" id="logoutBtn" title="خروج">⎋</button>
  </header>
  <div class="search"><input id="search" placeholder="ابحث عن شخص..."></div>
  <div id="list"></div>
</section>

<section id="chat" class="screen">
  <header class="chat-head">
    <button class="icon-btn" id="back">›</button>
    <div class="avatar small" id="cAvatar"></div>
    <div class="meta">
      <div class="name" id="cName"></div>
      <div class="sub-line" id="cStatus"></div>
    </div>
  </header>
  <div id="msgs"></div>
  <div class="typing" id="typing" hidden>يكتب الآن...</div>
  <div class="composer">
    <input id="txt" placeholder="اكتب رسالة..." autocomplete="off">
    <button class="send" id="sendBtn">➤</button>
  </div>
</section>
