<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="kalimat — منصة لامركزية للكلمة والصورة والفيديو.">
<title>kalimat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.10.4/lib/nostr.bundle.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnSearch" class="icon-btn" aria-label="بحث">⌕</button>
    <nav id="tabs">
      <button class="tab on" data-tab="all">لك</button>
      <button class="tab" data-tab="following">المتابعون</button>
    </nav>
    <div class="brand"><img src="icon-192.png" alt="" width="28" height="28"><b>kalimat</b></div>
  </header>

  <main id="feed" aria-live="polite">
    <div id="empty" class="empty">جارٍ الاتصال بالمرحّلات…</div>
  </main>

  <nav id="bottom">
    <button class="nav-btn on" data-view="home">الرئيسية</button>
    <button class="nav-btn" data-view="explore">استكشاف</button>
    <button class="nav-btn plus" id="btnPost" aria-label="نشر">+</button>
    <button class="nav-btn" data-view="notifications">الإشعارات</button>
    <button class="nav-btn" data-view="account">حسابي</button>
  </nav>

  <section id="page" class="page" hidden></section>
</div>

<dialog id="dlgLogin"></dialog>
<dialog id="dlgPost"></dialog>
<dialog id="dlgComments"></dialog>
<dialog id="dlgActions"></dialog>
<dialog id="dlgNotice"></dialog>
</body>
  </html>
