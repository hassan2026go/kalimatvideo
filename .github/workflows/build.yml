name: Build Nabdh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
          - name: Diagnose Firebase config
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "App directory:"
          ls -la app || true

          echo "Searching for Firebase config:"
          find . -name "google-services.json" -type f

          if [ ! -f app/google-services.json ]; then
            echo "ERROR: Firebase config not found at app/google-services.json"
            exit 1
          fi

          echo "SUCCESS: Firebase config exists at app/google-services.json"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nabdh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
